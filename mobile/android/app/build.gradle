plugins { id 'com.android.application' }

android {
    namespace 'local.aniimo.dungeonmap.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'local.aniimo.dungeonmap.mobile'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'local.aniimo.dungeonmap.mobile.MobileSmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
