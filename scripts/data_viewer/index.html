<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搶蛋地圖 · 點位解析</title>
<link rel="icon" href="favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256">
<link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="i18n.css">
<link rel="stylesheet" href="loot-ranking.css">
<link rel="stylesheet" href="shop-advice.css">
<body>
<aside>
  <div class="map-selectors"><div><label for="map">選擇地圖</label><select id="map" title="滑鼠停在選單上，滾輪可切換地圖"></select></div><div><label for="difficulty">難度</label><select id="difficulty" title="滑鼠停在選單上，滾輪可切換難度"><option value="5">惡夢</option><option value="6">混沌</option></select></div></div>
  <div class="route-setting">
    <label class="check"><input type="checkbox" id="best-route"><span>顯示最佳路徑</span></label>
    <label for="route-number">選擇路線</label>
    <select id="route-number"><option value="1">路線 1</option><option value="2">路線 2</option></select>
    <label for="route-start">路線出發點</label>
    <select id="route-start"><option value="auto">自動選擇較順路的起點</option><option value="entrance">從入口出發</option><option value="exit">從出口出發</option></select>
  </div>
  <fieldset><legend>顯示類型 <span id="filter-total"></span></legend><div id="filters"></div><p class="floor-legend"><strong>2F</strong> <span data-i18n="map.secondFloorLegend">表示二樓寶箱</span></p><div class="actions"><button id="all">全部顯示</button><button id="none">全部隱藏</button></div></fieldset>
  <label for="icon-size">圖示大小 <output id="icon-size-value" for="icon-size">150%</output></label>
  <input type="range" id="icon-size" min="75" max="250" step="25" value="150" aria-valuetext="150%">
  <label class="check supplemental"><input type="checkbox" id="supplements" checked><span>顯示房間模組補充點</span></label>
  <p class="small">虛線外圈表示依同房間模板補出的候選位置，尚待遊戲畫面核對；星法師肖像為首領候選點。</p>
  <div class="sidebar-guides"><button id="loot-ranking-button" type="button" data-i18n="loot.button" aria-haspopup="dialog" aria-controls="loot-ranking-dialog">道具價值排名</button><button id="ticket-advice-button" type="button" data-i18n="shop.ticketButton" aria-haspopup="dialog" aria-controls="ticket-advice-dialog">混沌船票每日購買建議</button><button id="egg-advice-button" type="button" data-i18n="shop.eggButton" aria-haspopup="dialog" aria-controls="egg-advice-dialog">謎之蛋盒購買</button></div>
  <footer>資源版本 3595896 · 本機資料</footer>
</aside>
<main>
  <div class="mapbar"><div><span class="eyebrow" id="map-id"></span><h2 id="map-title"></h2></div><div class="tools"><button id="zoom-out" aria-label="縮小地圖">−</button><button id="fit">符合視窗</button><button id="zoom-in" aria-label="放大地圖">＋</button></div></div>
  <p class="notice">候選位置不代表當場一定出現。切換難度會篩選蛋巢及其中的怪物模組；其他點位保留各候選群組。</p>
  <p id="icon-status" role="status"></p>
  <div class="stage"><canvas id="map-canvas" tabindex="0" aria-label="地宮候選點地圖。可拖曳、滾輪縮放，或使用方向鍵與加減鍵。"></canvas><div id="load-status" role="status"></div></div>
</main>
<dialog id="loot-ranking-dialog" aria-labelledby="loot-ranking-title" aria-describedby="loot-ranking-hint">
  <div class="loot-heading">
    <h2 id="loot-ranking-title" data-i18n="loot.button">道具價值排名</h2>
    <p id="loot-ranking-hint" data-i18n="loot.hint"></p>
    <p data-i18n="loot.limits"></p>
    <p data-i18n="loot.scope"></p>
  </div>
  <div class="loot-table-wrap">
    <table class="loot-table" aria-labelledby="loot-ranking-title">
      <colgroup><col class="loot-rank"><col class="loot-name"><col class="loot-weight"><col class="loot-price"><col class="loot-value"><col class="loot-pack"></colgroup>
      <thead><tr><th scope="col" data-i18n="loot.rank"></th><th scope="col" data-i18n="loot.item"></th><th scope="col" data-i18n="loot.weight"></th><th scope="col" data-i18n="loot.price"></th><th scope="col" data-i18n="loot.value" aria-sort="descending"></th><th scope="col" data-i18n="loot.pack"></th></tr></thead>
      <tbody id="loot-ranking-body"></tbody>
    </table>
  </div>
  <div class="loot-actions"><button id="close-loot-ranking" type="button" data-i18n="close" autofocus>關閉</button></div>
</dialog>
<dialog id="ticket-advice-dialog" class="shop-dialog" aria-labelledby="ticket-advice-title"><h2 id="ticket-advice-title" data-i18n="shop.ticketButton"></h2><div id="ticket-advice-content"></div><button type="button" class="shop-close" data-i18n="close">關閉</button></dialog>
<dialog id="egg-advice-dialog" class="shop-dialog" aria-labelledby="egg-advice-title"><h2 id="egg-advice-title" data-i18n="shop.eggButton"></h2><div id="egg-advice-content"></div><button type="button" class="shop-close" data-i18n="close">關閉</button></dialog>
<noscript>請啟用 JavaScript，或直接開啟 candidates.csv 檢視點位。</noscript>
<script src="locales.js"></script><script src="i18n.js"></script><script src="data.js"></script><script src="viewer.js"></script>
<script src="loot-data.js"></script><script src="loot-ranking.js"></script><script src="shop-data.js"></script><script src="shop-advice.js"></script>
</body></html>
