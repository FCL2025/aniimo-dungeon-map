<dialog id="update-dialog" aria-labelledby="update-title" aria-describedby="update-description">
  <h2 id="update-title" data-i18n="update.title">發現新版本</h2>
  <p id="update-description"></p>
  <p id="update-notes" hidden></p>
  <p id="update-progress" role="status" aria-live="polite" hidden></p>
  <div class="update-actions">
    <button id="update-later" type="button" data-i18n="update.later">稍後</button>
    <button id="update-action" type="button"></button>
  </div>
</dialog>
